<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spot the Clue — interaction mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100d09;
    --surface-raised: #271e13;
    --border: #4a3f2c;
    --text: #ece2cc;
    --text-dim: #a89a7d;
    --gold: #d6ab3d;
    --nugget: #f4c542;
    --dirt: #8a6338;
    --rock: #8a8a86;
    --wildcard: #a05a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Oswald', ui-sans-serif, sans-serif;
    min-height: 100vh;
    padding: 30px 16px 60px;
  }
  .page-label {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1.page-title {
    text-align: center;
    font-family: 'Roboto Slab', Georgia, serif;
    font-size: 22px;
    margin: 0 0 30px;
  }

  .frame {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 26px),
      linear-gradient(180deg, #15100a 0%, #0d0a06 100%);
    border: 3px solid #4a3a24;
    border-radius: 6px;
    box-shadow: 0 0 0 8px #2a2016, 0 0 0 9px #000, 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.06);
    padding: 32px 28px;
  }
  .bolt {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfc7ad, #6b5f45 60%, #382e1c);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .bolt.tl { top: 10px; left: 10px; } .bolt.tr { top: 10px; right: 10px; }
  .bolt.bl { bottom: 10px; left: 10px; } .bolt.br { bottom: 10px; right: 10px; }

  .kicker { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .instructions { color: var(--text-dim); font-size: 14px; margin: 0 0 22px; line-height: 1.5; }

  .statement-card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-top: 3px solid var(--gold);
    border-radius: 10px;
    padding: 24px 20px;
    margin-bottom: 20px;
  }
  .statement-label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .sentence { font-size: 19px; line-height: 1.9; }
  .chip {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-user-select: none; user-select: none;
  }
  .chip.plain { color: var(--text-dim); }
  .chip:hover:not(.locked) { background: rgba(214,171,61,0.18); }
  .chip.selected { background: var(--gold); color: #100d09; font-weight: 600; }
  .chip.correct-reveal { background: var(--gold); color: #100d09; font-weight: 600; box-shadow: 0 0 0 2px var(--nugget); }
  .chip.missed-reveal { background: transparent; color: var(--nugget); text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px; }
  .chip.wrong-reveal { background: var(--wildcard); color: #fff; text-decoration: line-through; opacity: 0.7; }

  .noclue-btn {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .noclue-btn:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text); }
  .noclue-btn.selected { border-color: var(--gold); color: var(--gold); background: rgba(214,171,61,0.1); }
  .noclue-btn:disabled { cursor: default; }

  .btn {
    width: 100%;
    background: var(--gold);
    color: #100d09;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

  .reveal { display: none; }
  .reveal.show { display: block; }
  .reveal-row {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .reveal-row .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 4px; }
  .reveal-row .value { font-size: 15px; }
  .signal-tag {
    display: inline-block;
    background: var(--nugget);
    color: #100d09;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 4px;
  }
  .verdict { text-align: center; font-family: 'Roboto Slab', Georgia, serif; font-size: 17px; margin: 4px 0 18px; }
  .verdict.good { color: var(--gold); }
  .verdict.partial { color: var(--nugget); }
  .verdict.miss { color: var(--wildcard); }

  .nav-row { display: flex; gap: 10px; margin-top: 18px; }
  .example-dots { text-align: center; margin-top: 16px; color: var(--text-dim); font-size: 12px; }
  .example-dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--border); margin: 0 3px; }
  .example-dots span.active { background: var(--gold); }
</style>
</head>
<body>

<p class="page-label">Interaction mockup &middot; not final visual polish</p>
<h1 class="page-title">Spot the Clue</h1>

<div class="frame">
  <div class="bolt tl"></div><div class="bolt tr"></div>
  <div class="bolt bl"></div><div class="bolt br"></div>

  <p class="kicker">Round: Spot the Clue</p>
  <p class="instructions" id="instructions">A prospect just said something. Tap the word or phrase that's the real clue — the part worth digging into.</p>

  <div class="statement-card">
    <p class="statement-label">The prospect says:</p>
    <p class="sentence" id="sentence"></p>
  </div>

  <button class="btn" id="checkBtn" disabled>Check my read</button>

  <div class="reveal" id="reveal">
    <p class="verdict" id="verdict"></p>
    <div class="reveal-row" id="signalRow">
      <p class="label">Signal type</p>
      <p class="value"><span class="signal-tag" id="signalTag"></span></p>
    </div>
    <div class="reveal-row">
      <p class="label">Ask this to keep digging</p>
      <p class="value" id="askText"></p>
    </div>
    <div class="nav-row">
      <button class="btn secondary" id="nextBtn">Next statement</button>
    </div>
  </div>

  <div class="example-dots" id="dots"></div>
</div>

<script>
const EXAMPLES = [
  {
    chunks: ["We", "usually", "hear about opportunities", "after they're", "already", "pretty far along", "."],
    clueIndexes: [1, 5],
    noClue: false,
    signal: "Timing",
    ask: "\u201cWhat isn't getting done because of it?\u201d"
  },
  {
    chunks: ["It hasn't worked", ",", "and honestly we're", "getting a little tired", "of trying new things", "that don't stick", "."],
    clueIndexes: [0, 3],
    noClue: false,
    signal: "Frustration",
    ask: "\u201cWhat have you already tried?\u201d"
  },
  {
    chunks: ["We've", "always", "pulled opportunities", "from SAM.gov", "by hand", ", that's just", "how it's done here", "."],
    clueIndexes: [1, 6],
    noClue: false,
    signal: "Habit",
    ask: "\u201cWhat would have to change for that to change?\u201d"
  },
  {
    chunks: ["We've been", "testing", "a couple different approaches", "to see", "what sticks", "."],
    clueIndexes: [1],
    noClue: false,
    signal: "Trial and Error",
    ask: "\u201cWhat are you measuring to know if it's working?\u201d"
  }
];

let current = 0;
let selected = new Set();
let checked = false;

const sentenceEl = document.getElementById('sentence');
const checkBtn = document.getElementById('checkBtn');
const reveal = document.getElementById('reveal');
const verdict = document.getElementById('verdict');
const signalTag = document.getElementById('signalTag');
const signalRow = document.getElementById('signalRow');
const askText = document.getElementById('askText');
const nextBtn = document.getElementById('nextBtn');
const dotsEl = document.getElementById('dots');

function renderDots() {
  dotsEl.innerHTML = EXAMPLES.map((_, i) => `<span class="${i === current ? 'active' : ''}"></span>`).join('');
}

function renderSentence() {
  const ex = EXAMPLES[current];
  sentenceEl.innerHTML = ex.chunks.map((chunk, i) => {
    const isPunct = chunk === '.' || chunk === ',';
    const cls = isPunct ? 'chip plain' : 'chip';
    return `<span class="${cls}" data-i="${i}">${chunk}</span>`;
  }).join(' ');

  sentenceEl.querySelectorAll('.chip').forEach(el => {
    if (el.classList.contains('plain')) return;
    el.addEventListener('click', () => {
      if (checked) return;
      const i = parseInt(el.dataset.i);
      if (selected.has(i)) { selected.delete(i); el.classList.remove('selected'); }
      else { selected.add(i); el.classList.add('selected'); }
      updateCheckBtn();
    });
  });
}

function updateCheckBtn() {
  checkBtn.disabled = selected.size === 0;
}

checkBtn.addEventListener('click', () => {
  checked = true;
  const ex = EXAMPLES[current];
  const correctSet = new Set(ex.clueIndexes);

  sentenceEl.querySelectorAll('.chip').forEach(el => {
    el.classList.add('locked');
    const i = parseInt(el.dataset.i);
    if (el.classList.contains('plain')) return;
    const wasSelected = selected.has(i);
    const isCorrect = correctSet.has(i);
    el.classList.remove('selected');
    if (isCorrect) el.classList.add('correct-reveal');
    else if (wasSelected) el.classList.add('wrong-reveal');
  });

  let allCorrectFound = [...correctSet].every(i => selected.has(i));
  let noWrongPicks = [...selected].every(i => correctSet.has(i));

  signalRow.style.display = '';
  signalTag.textContent = ex.signal;
  askText.textContent = ex.ask;
  if (allCorrectFound && noWrongPicks) {
    verdict.textContent = "Found it \u2014 that's the clue.";
    verdict.className = 'verdict good';
  } else if (allCorrectFound || [...selected].some(i => correctSet.has(i))) {
    verdict.textContent = "Partly there \u2014 see what you missed below.";
    verdict.className = 'verdict partial';
  } else {
    verdict.textContent = "Not quite \u2014 here's the real clue.";
    verdict.className = 'verdict miss';
  }

  reveal.classList.add('show');
  checkBtn.style.display = 'none';
});

nextBtn.addEventListener('click', () => {
  current = (current + 1) % EXAMPLES.length;
  selected = new Set();
  checked = false;
  reveal.classList.remove('show');
  checkBtn.style.display = '';
  checkBtn.disabled = true;
  renderSentence();
  renderDots();
});

renderSentence();
renderDots();
</script>

</body>
</html>
